<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotesVault - React Dashboard</title>
  
  <!-- React & React-DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#F0FDF4',
              100: '#CCFBF1',
              200: '#99F6E4',
              600: '#0D9488',
              700: '#0F766E',
              800: '#115E59',
            },
            slate: {
              850: '#1E293B',
              900: '#0F172A',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background-color: #FFFFFF;
      color: #0F172A;
    }
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
      border-color: #0D9488;
    }
    .nav-item-active {
      background-color: #F0FDF4;
      color: #0F766E;
      border-right: 3px solid #0D9488;
      font-weight: 600;
    }
    .progress-ring-circle {
      transition: stroke-dashoffset 0.35s ease-in-out;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body class="bg-white text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <!-- Standalone React Component Script -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function NotesVaultReactApp() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchModalOpen, setSearchModalOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedSemester, setSelectedSemester] = useState('Semester 2');
      const [resourceFilter, setResourceFilter] = useState('all');
      const [practiceTab, setPracticeTab] = useState('recommended');
      const [toastMessage, setToastMessage] = useState(null);
      const [isBookmarked, setIsBookmarked] = useState(false);

      const [tasks, setTasks] = useState([
        { id: 1, text: 'Study 3 topics', completed: true },
        { id: 2, text: 'Solve 5 questions', completed: true },
        { id: 3, text: 'Read 1 resource', completed: true },
        { id: 4, text: 'Review Notes', completed: false }
      ]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setSearchModalOpen((prev) => !prev);
          }
          if (e.key === 'Escape') setSearchModalOpen(false);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      useEffect(() => {
        if (window.lucide) {
          setTimeout(() => window.lucide.createIcons(), 50);
        }
      }, [activeTab, searchModalOpen, resourceFilter, practiceTab]);

      const completedCount = tasks.filter((t) => t.completed).length;
      const totalCount = tasks.length;
      const radius = 42;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (completedCount / totalCount) * circumference;

      const toggleTask = (id) => {
        setTasks((prev) =>
          prev.map((t) => {
            if (t.id === id) {
              const updated = !t.completed;
              showToast(updated ? 'Task marked as completed!' : 'Task updated');
              return { ...t, completed: updated };
            }
            return t;
          })
        );
      };

      return (
        <div className="bg-white text-slate-800 antialiased min-h-screen flex flex-col font-sans">
          {/* TOP HEADER - CENTERED SEARCH BAR */}
          <header className="h-16 bg-white border-b border-slate-200 sticky top-0 z-30 px-6 flex items-center justify-between">
            <div className="w-48 flex items-center gap-2">
              <span className="font-extrabold text-slate-900 text-base tracking-tight">NotesVault</span>
            </div>

            {/* CENTERED SEARCH BAR */}
            <div className="flex-1 max-w-xl mx-auto flex justify-center">
              <button
                onClick={() => setSearchModalOpen(true)}
                className="w-full flex items-center justify-between bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-500 rounded-lg px-4 py-2 text-sm transition-colors"
              >
                <div className="flex items-center gap-2">
                  <i data-lucide="search" className="w-4 h-4 text-slate-400"></i>
                  <span>Search subjects, topics, questions, resources...</span>
                </div>
                <div className="flex items-center gap-1 font-mono text-xs text-slate-400 font-semibold bg-white border border-slate-200 rounded px-1.5 py-0.5">
                  <span>Ctrl</span>
                  <span>K</span>
                </div>
              </button>
            </div>

            <div className="w-48 flex items-center justify-end gap-4">
              <button onClick={() => showToast('No new notifications')} className="relative p-2 text-slate-500 hover:text-slate-800 rounded-lg hover:bg-slate-100">
                <i data-lucide="bell" className="w-5 h-5"></i>
                <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full"></span>
              </button>

              <div className="flex items-center gap-3 pl-3 border-l border-slate-200 cursor-pointer" onClick={() => setActiveTab('settings')}>
                <div className="w-9 h-9 rounded-full bg-slate-100 border border-slate-200 text-slate-800 font-bold text-sm flex items-center justify-center">
                  S
                </div>
                <div className="hidden sm:block text-left">
                  <div className="text-sm font-bold text-slate-900 leading-tight">Sujan</div>
                  <div className="text-xs text-slate-500 leading-tight">Student</div>
                </div>
                <i data-lucide="chevron-down" className="w-4 h-4 text-slate-400"></i>
              </div>
            </div>
          </header>

          <div className="flex flex-1">
            {/* LEFT SIDEBAR NAVIGATION */}
            <aside className="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4 min-h-[calc(100vh-4rem)]">
              <div className="space-y-6">
                <div className="flex items-center gap-3 px-2 py-1">
                  <div className="w-8 h-8 rounded-lg bg-teal-700 text-white flex items-center justify-center">
                    <i data-lucide="book-open" className="w-5 h-5"></i>
                  </div>
                  <div>
                    <div className="font-extrabold text-lg text-slate-900 leading-none">NotesVault</div>
                    <div className="text-[10px] tracking-wider uppercase font-semibold text-slate-400 mt-0.5">Learn · Practice · Grow</div>
                  </div>
                </div>

                <nav className="space-y-1">
                  {[
                    { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                    { id: 'semesters', label: 'Semesters', icon: 'book-marked' },
                    { id: 'subjects', label: 'Subjects', icon: 'layers' },
                    { id: 'practice', label: 'Practice', icon: 'file-check-2' },
                    { id: 'resources', label: 'Resources', icon: 'folder-git-2' }
                  ].map((item) => (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors ${
                        activeTab === item.id ? 'nav-item-active bg-teal-50 text-teal-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'
                      }`}
                    >
                      <i data-lucide={item.icon} className="w-4 h-4"></i>
                      <span>{item.label}</span>
                    </button>
                  ))}
                </nav>

                {/* TOOLS SECTION (AI ASSISTANT REMOVED) */}
                <div>
                  <div className="px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Tools</div>
                  <nav className="space-y-1">
                    <button
                      onClick={() => setActiveTab('announcements')}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors ${
                        activeTab === 'announcements' ? 'nav-item-active bg-teal-50 text-teal-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'
                      }`}
                    >
                      <i data-lucide="megaphone" className="w-4 h-4"></i>
                      <span>Announcements</span>
                    </button>
                    <button
                      onClick={() => setActiveTab('feedback')}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors ${
                        activeTab === 'feedback' ? 'nav-item-active bg-teal-50 text-teal-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'
                      }`}
                    >
                      <i data-lucide="message-square" className="w-4 h-4"></i>
                      <span>Feedback</span>
                    </button>
                  </nav>
                </div>
              </div>

              <div className="pt-4 border-t border-slate-200">
                <button
                  onClick={() => setActiveTab('settings')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors ${
                    activeTab === 'settings' ? 'nav-item-active bg-teal-50 text-teal-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'
                  }`}
                >
                  <i data-lucide="settings" className="w-4 h-4"></i>
                  <span>Settings</span>
                </button>
              </div>
            </aside>

            {/* MAIN CONTENT AREA */}
            <main className="flex-1 bg-white p-8 overflow-y-auto">
              
              {/* PAGE 1: DASHBOARD */}
              {activeTab === 'dashboard' && (
                <div className="space-y-8">
                  <div>
                    <div className="text-xs font-semibold text-slate-500 mb-1">Monday, 29 June 2026</div>
                    <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Good morning, Sujan</h1>
                    <p className="text-sm text-slate-500 mt-0.5">Small steps today, big progress tomorrow.</p>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div className="lg:col-span-2 space-y-8">
                      <div className="bg-white border border-slate-200 rounded-2xl p-6 relative overflow-hidden shadow-sm hover:border-teal-600">
                        <div className="flex items-center gap-2 text-xs font-semibold text-teal-700 mb-3">
                          <i data-lucide="play-circle" className="w-4 h-4"></i>
                          <span>Continue Learning</span>
                        </div>
                        <h2 className="text-xl font-bold text-slate-900 mb-1">Binary Search</h2>
                        <p className="text-xs font-medium text-slate-500 mb-3">Data Structures · Unit 2 · Searching</p>
                        <p className="text-sm text-slate-600 mb-6 max-w-lg">
                          A searching algorithm for finding an element in a sorted array by repeatedly dividing the search space.
                        </p>

                        <div className="flex items-center gap-4">
                          <button onClick={() => setActiveTab('subjects')} className="bg-teal-700 hover:bg-teal-800 text-white text-sm font-semibold px-4 py-2.5 rounded-lg flex items-center gap-2">
                            <span>Continue reading</span>
                            <i data-lucide="arrow-right" className="w-4 h-4"></i>
                          </button>
                          <button onClick={() => { setIsBookmarked(!isBookmarked); showToast(isBookmarked ? 'Bookmark removed' : 'Saved to bookmarks'); }} className="p-2.5 border rounded-lg border-slate-200 text-slate-400 hover:text-slate-700">
                            <i data-lucide="bookmark" className="w-4 h-4"></i>
                          </button>
                        </div>

                        <div className="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs">
                          <div className="w-full bg-slate-100 rounded-full h-2 mr-4 overflow-hidden">
                            <div className="bg-teal-700 h-2 rounded-full" style={{ width: '82%' }}></div>
                          </div>
                          <span className="font-bold text-slate-700 whitespace-nowrap">82% complete</span>
                        </div>
                      </div>

                      {/* Semesters Cards */}
                      <div>
                        <div className="flex items-center justify-between mb-4">
                          <h3 className="text-base font-bold text-slate-900">Your Semesters</h3>
                          <button onClick={() => setActiveTab('semesters')} className="text-xs font-semibold text-teal-700 flex items-center gap-1">
                            View all <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                          {['1', '2', '3', '4', '5', '6'].map((num) => (
                            <div key={num} onClick={() => setActiveTab('semesters')} className="card-hover bg-white border border-slate-200 rounded-xl p-4 cursor-pointer">
                              <div className={`w-8 h-8 rounded-lg flex items-center justify-center mb-3 ${num === '1' ? 'bg-teal-50 text-teal-700' : 'bg-slate-100 text-slate-700'}`}>
                                <i data-lucide="book" className="w-4 h-4"></i>
                              </div>
                              <div className="font-bold text-sm text-slate-900">Semester {num}</div>
                              <div className="text-xs text-slate-500 mt-0.5">{num === '3' || num === '5' || num === '6' ? '7 Subjects' : '6 Subjects'}</div>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Recently Opened */}
                      <div>
                        <div className="flex items-center justify-between mb-4">
                          <h3 className="text-base font-bold text-slate-900">Recently Opened</h3>
                          <button onClick={() => setActiveTab('subjects')} className="text-xs font-semibold text-teal-700 flex items-center gap-1">
                            View all <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                          </button>
                        </div>

                        <div className="space-y-2">
                          {[
                            { title: 'Binary Search', sub: 'Data Structures · Unit 2', time: 'Yesterday', prog: '82%', icon: 'file-text', highlight: true },
                            { title: 'Python Classes and Objects', sub: 'Python Programming · Unit 4', time: '3 days ago', prog: '64%', icon: 'code' },
                            { title: 'MIPS Architecture', sub: 'Computer Organization · Unit 3', time: '5 days ago', prog: '40%', icon: 'cpu' },
                            { title: 'Boolean Algebra', sub: 'Digital Design · Unit 1', time: '1 week ago', prog: '100%', icon: 'circuit-board' }
                          ].map((item, idx) => (
                            <div key={idx} onClick={() => setActiveTab('subjects')} className="flex items-center justify-between p-3.5 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors cursor-pointer">
                              <div className="flex items-center gap-3">
                                <div className={`w-9 h-9 rounded-lg border flex items-center justify-center ${item.highlight ? 'bg-teal-50 border-teal-100 text-teal-700' : 'bg-slate-100 border-slate-200 text-slate-700'}`}>
                                  <i data-lucide={item.icon} className="w-4 h-4"></i>
                                </div>
                                <div>
                                  <div className="text-sm font-bold text-slate-900">{item.title}</div>
                                  <div className="text-xs text-slate-500">{item.sub}</div>
                                </div>
                              </div>
                              <div className="flex items-center gap-6">
                                <span className="text-xs text-slate-400">{item.time}</span>
                                <span className="text-xs font-bold text-teal-700 w-12 text-right">{item.prog}</span>
                                <i data-lucide="chevron-right" className="w-4 h-4 text-slate-400"></i>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* Right Column */}
                    <div className="space-y-6">
                      <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <div className="flex items-center justify-between mb-4">
                          <h3 className="text-base font-bold text-slate-900">Today's Plan</h3>
                          <span className="text-xs font-semibold text-teal-700">View all</span>
                        </div>

                        <div className="flex justify-center my-4">
                          <div className="relative w-32 h-32 flex items-center justify-center">
                            <svg className="w-full h-full" viewBox="0 0 100 100">
                              <circle cx="50" cy="50" r="42" stroke="#E2E8F0" strokeWidth="8" fill="none" />
                              <circle className="progress-ring-circle" cx="50" cy="50" r="42" stroke="#0D9488" strokeWidth="8" fill="none" strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} strokeLinecap="round" />
                            </svg>
                            <div className="absolute text-center">
                              <div className="text-xl font-extrabold text-slate-900">{completedCount}/{totalCount}</div>
                              <div className="text-[10px] uppercase font-bold text-slate-400">tasks</div>
                            </div>
                          </div>
                        </div>

                        <div className="space-y-3 mt-4">
                          {tasks.map((t) => (
                            <label key={t.id} className="flex items-center gap-3 text-sm cursor-pointer select-none">
                              <input type="checkbox" checked={t.completed} onChange={() => toggleTask(t.id)} className="w-4 h-4 text-teal-700 rounded border-slate-300 focus:ring-teal-500" />
                              <span className={t.completed ? 'text-slate-400 line-through' : 'text-slate-700'}>{t.text}</span>
                            </label>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 2: SEMESTERS */}
              {activeTab === 'semesters' && (
                <div className="space-y-6">
                  <div className="flex items-center gap-2 text-xs text-slate-500 font-medium">
                    <span>Home</span>
                    <i data-lucide="chevron-right" className="w-3.5 h-3.5"></i>
                    <span className="text-slate-900 font-semibold">Semesters</span>
                  </div>

                  <div>
                    <h1 className="text-2xl font-extrabold text-slate-900">Semesters</h1>
                    <p className="text-sm text-slate-500">Browse subjects, notes and resources by semester.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {[
                      { sem: 'Semester 1', count: '6 subjects', desc: 'Build your foundation with core engineering concepts.', highlight: true },
                      { sem: 'Semester 2', count: '6 subjects', desc: 'Strengthen your fundamentals and programming skills.' },
                      { sem: 'Semester 3', count: '7 subjects', desc: 'Explore core computer science and problem solving.' },
                      { sem: 'Semester 4', count: '6 subjects', desc: 'Dive deeper into systems, design and analysis.' },
                      { sem: 'Semester 5', count: '7 subjects', desc: 'Advance your technical knowledge and practical skills.' },
                      { sem: 'Semester 6', count: '6 subjects', desc: 'Prepare for advanced topics and real-world applications.' }
                    ].map((s, idx) => (
                      <div key={idx} onClick={() => { setSelectedSemester(s.sem); setActiveTab('subjects'); showToast(`Opened ${s.sem}`); }} className="card-hover bg-white border border-slate-200 rounded-2xl p-6 cursor-pointer">
                        <div className="flex items-center justify-between mb-4">
                          <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-bold ${s.highlight ? 'bg-teal-50 text-teal-700' : 'bg-slate-100 text-slate-700'}`}>
                            <i data-lucide="book-open" className="w-5 h-5"></i>
                          </div>
                          <i data-lucide="arrow-right" className="w-5 h-5 text-slate-400"></i>
                        </div>
                        <h3 className="text-lg font-bold text-slate-900">{s.sem}</h3>
                        <div className="text-xs font-semibold text-teal-700 mb-2">{s.count}</div>
                        <p className="text-xs text-slate-500 leading-relaxed">{s.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* PAGE 3: SUBJECTS */}
              {activeTab === 'subjects' && (
                <div className="space-y-6">
                  <div className="flex items-center gap-2 text-xs text-slate-500 font-medium">
                    <span>Home</span>
                    <i data-lucide="chevron-right" className="w-3.5 h-3.5"></i>
                    <span className="text-slate-900 font-semibold">Subjects</span>
                  </div>

                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <h1 className="text-2xl font-extrabold text-slate-900">Subjects</h1>
                      <p className="text-sm text-slate-500">Explore subjects, access notes, practice questions and resources.</p>
                    </div>

                    <select value={selectedSemester} onChange={(e) => setSelectedSemester(e.target.value)} className="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white text-slate-700 font-medium">
                      <option>Semester 1</option>
                      <option>Semester 2</option>
                      <option>Semester 3</option>
                      <option>Semester 4</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {[
                      { title: 'Data Structures', units: '5 Units', desc: 'Learn fundamental data structures and algorithms with examples.', highlight: true, icon: 'cpu' },
                      { title: 'Python Programming', units: '5 Units', desc: 'Build problem solving skills using Python syntax and modules.', icon: 'code-2' },
                      { title: 'Computer Organization', units: '5 Units', desc: 'Understand computer architecture and its hardware components.', icon: 'monitor' },
                      { title: 'Digital Design', units: '5 Units', desc: 'Learn digital logic, minimization and sequential circuits.', icon: 'binary' },
                      { title: 'Mathematics', units: '5 Units', desc: 'Discrete mathematics and problem solving techniques.', icon: 'line-chart' },
                      { title: 'Communication Skills', units: '5 Units', desc: 'Improve technical communication and presentation skills.', icon: 'file-badge' }
                    ].map((subj, idx) => (
                      <div key={idx} className="card-hover bg-white border border-slate-200 rounded-2xl p-6 flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between mb-4">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-bold ${subj.highlight ? 'bg-teal-50 text-teal-700' : 'bg-slate-100 text-slate-700'}`}>
                              <i data-lucide={subj.icon} className="w-5 h-5"></i>
                            </div>
                            <i data-lucide="arrow-right" className="w-5 h-5 text-slate-400"></i>
                          </div>
                          <h3 className="text-base font-bold text-slate-900">{subj.title}</h3>
                          <div className="text-xs font-semibold text-teal-700 mb-2">{subj.units}</div>
                          <p className="text-xs text-slate-500 mb-6">{subj.desc}</p>
                        </div>
                        <div className="flex items-center gap-4 text-xs font-semibold text-slate-600 border-t border-slate-100 pt-4">
                          <button onClick={() => { setActiveTab('resources'); showToast(`Viewing ${subj.title} Notes`); }} className="hover:text-teal-700 flex items-center gap-1">
                            <i data-lucide="file-text" className="w-3.5 h-3.5"></i> Notes
                          </button>
                          <button onClick={() => { setActiveTab('practice'); showToast(`Viewing ${subj.title} Questions`); }} className="hover:text-teal-700 flex items-center gap-1">
                            <i data-lucide="file-check-2" className="w-3.5 h-3.5"></i> Question Bank
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* PAGE 4: PRACTICE */}
              {activeTab === 'practice' && (
                <div className="space-y-6">
                  <div className="flex items-center gap-2 text-xs text-slate-500 font-medium">
                    <span>Home</span>
                    <i data-lucide="chevron-right" className="w-3.5 h-3.5"></i>
                    <span className="text-slate-900 font-semibold">Practice</span>
                  </div>

                  <div>
                    <h1 className="text-2xl font-extrabold text-slate-900">Practice</h1>
                    <p className="text-sm text-slate-500">Solve questions, track your progress and strengthen your concepts.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div onClick={() => showToast('Opening Topic-wise Practice...')} className="card-hover bg-white border border-slate-200 rounded-2xl p-6 cursor-pointer">
                      <div className="flex items-center justify-between mb-4">
                        <div className="w-10 h-10 rounded-xl bg-teal-50 text-teal-700 flex items-center justify-center">
                          <i data-lucide="file-text" className="w-5 h-5"></i>
                        </div>
                        <i data-lucide="arrow-right" className="w-5 h-5 text-slate-400"></i>
                      </div>
                      <h3 className="text-base font-bold text-slate-900">Topic-wise Practice</h3>
                      <p className="text-xs text-slate-500 mt-1">Practice questions by topic</p>
                    </div>

                    <div onClick={() => showToast('Opening Subject-wise Practice...')} className="card-hover bg-white border border-slate-200 rounded-2xl p-6 cursor-pointer">
                      <div className="flex items-center justify-between mb-4">
                        <div className="w-10 h-10 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center">
                          <i data-lucide="layers" className="w-5 h-5"></i>
                        </div>
                        <i data-lucide="arrow-right" className="w-5 h-5 text-slate-400"></i>
                      </div>
                      <h3 className="text-base font-bold text-slate-900">Subject-wise Practice</h3>
                      <p className="text-xs text-slate-500 mt-1">Full subject question sets</p>
                    </div>

                    <div onClick={() => showToast('Opening Previous Year Questions...')} className="card-hover bg-white border border-slate-200 rounded-2xl p-6 cursor-pointer">
                      <div className="flex items-center justify-between mb-4">
                        <div className="w-10 h-10 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center">
                          <i data-lucide="clock" className="w-5 h-5"></i>
                        </div>
                        <i data-lucide="arrow-right" className="w-5 h-5 text-slate-400"></i>
                      </div>
                      <h3 className="text-base font-bold text-slate-900">Previous Year Questions</h3>
                      <p className="text-xs text-slate-500 mt-1">Practice past exam questions</p>
                    </div>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-200 pb-4">
                      <div className="flex items-center gap-6 text-sm font-bold">
                        <button className="text-teal-700 border-b-2 border-teal-700 pb-4 -mb-4">Recommended</button>
                        <button className="text-slate-500 hover:text-slate-800 pb-4 -mb-4">Recent</button>
                        <button className="text-slate-500 hover:text-slate-800 pb-4 -mb-4">Bookmarks</button>
                      </div>
                    </div>

                    <div className="space-y-3 pt-2">
                      {[
                        { title: 'Arrays and Searching', sub: 'Data Structures · 25 questions', diff: 'Easy', tagColor: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
                        { title: 'Python Functions', sub: 'Python Programming · 20 questions', diff: 'Medium', tagColor: 'bg-amber-50 text-amber-700 border-amber-200' },
                        { title: 'Computer Architecture Basics', sub: 'Computer Organization · 30 questions', diff: 'Medium', tagColor: 'bg-amber-50 text-amber-700 border-amber-200' },
                        { title: 'Logic Gates and Boolean Algebra', sub: 'Digital Design · 28 questions', diff: 'Medium', tagColor: 'bg-amber-50 text-amber-700 border-amber-200' },
                        { title: 'Discrete Mathematics', sub: 'Mathematics · 25 questions', diff: 'Hard', tagColor: 'bg-rose-50 text-rose-700 border-rose-200' }
                      ].map((q, idx) => (
                        <div key={idx} className="flex items-center justify-between p-4 border border-slate-200 rounded-xl hover:border-teal-600 transition-colors">
                          <div className="flex items-center gap-4">
                            <div className="w-10 h-10 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center">
                              <i data-lucide="file-code" className="w-5 h-5"></i>
                            </div>
                            <div>
                              <div className="text-sm font-bold text-slate-900">{q.title}</div>
                              <div className="text-xs text-slate-500">{q.sub}</div>
                            </div>
                          </div>
                          <div className="flex items-center gap-4">
                            <span className={`px-2.5 py-1 border rounded-md text-xs font-bold ${q.tagColor}`}>{q.diff}</span>
                            <button onClick={() => showToast(`Starting ${q.title} practice...`)} className="bg-teal-700 hover:bg-teal-800 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-1">
                              Start <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 5: RESOURCES */}
              {activeTab === 'resources' && (
                <div className="space-y-6">
                  <div className="flex items-center gap-2 text-xs text-slate-500 font-medium">
                    <span>Home</span>
                    <i data-lucide="chevron-right" className="w-3.5 h-3.5"></i>
                    <span className="text-slate-900 font-semibold">Resources</span>
                  </div>

                  <div>
                    <h1 className="text-2xl font-extrabold text-slate-900">Resources</h1>
                    <p className="text-sm text-slate-500">Access study materials, notes, question banks and useful links – all in one place.</p>
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    {[
                      { id: 'all', label: 'All' },
                      { id: 'notes', label: 'Notes' },
                      { id: 'qb', label: 'Question Banks' },
                      { id: 'lab', label: 'Lab Manuals' },
                      { id: 'pyq', label: 'Previous Year Papers' }
                    ].map((f) => (
                      <button key={f.id} onClick={() => setResourceFilter(f.id)} className={`px-4 py-2 rounded-full text-xs font-bold transition-colors ${resourceFilter === f.id ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                        {f.label}
                      </button>
                    ))}
                  </div>

                  <div className="bg-white border border-slate-200 rounded-2xl divide-y divide-slate-100 shadow-sm">
                    {[
                      { title: 'Data Structures Notes', sub: 'Module 1 – 5 · Complete Notes', size: '2.4 MB', type: 'PDF', cat: 'notes' },
                      { title: 'Python Programming Question Bank', sub: 'Unit wise questions with solutions', size: '1.8 MB', type: 'QB', cat: 'qb' },
                      { title: 'Computer Organization Lab Manual', sub: 'Experiments and programs', size: '3.1 MB', type: 'LAB', cat: 'lab' },
                      { title: 'Digital Design Previous Year Papers', sub: 'VTU 2018 – 2024', size: '4.2 MB', type: 'PYQ', cat: 'pyq' }
                    ]
                      .filter((r) => resourceFilter === 'all' || r.cat === resourceFilter)
                      .map((res, idx) => (
                        <div key={idx} className="flex items-center justify-between p-4 hover:bg-slate-50 transition-colors">
                          <div className="flex items-center gap-4">
                            <div className="w-10 h-10 rounded-lg bg-teal-50 border border-teal-100 text-teal-700 flex items-center justify-center font-bold text-xs">
                              {res.type}
                            </div>
                            <div>
                              <div className="text-sm font-bold text-slate-900">{res.title}</div>
                              <div className="text-xs text-slate-500">{res.sub}</div>
                            </div>
                          </div>
                          <div className="flex items-center gap-6">
                            <span className="text-xs text-slate-400">{res.size}</span>
                            <button onClick={() => showToast(`Downloading ${res.title}...`)} className="bg-teal-50 hover:bg-teal-100 text-teal-700 text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-1">
                              View & Download <i data-lucide="download" className="w-3.5 h-3.5"></i>
                            </button>
                          </div>
                        </div>
                      ))}
                  </div>
                </div>
              )}

              {/* PAGE 6: ANNOUNCEMENTS */}
              {activeTab === 'announcements' && (
                <div className="space-y-6">
                  <div>
                    <h1 className="text-2xl font-extrabold text-slate-900">Announcements</h1>
                    <p className="text-sm text-slate-500">Stay updated with official college notices and exam dates.</p>
                  </div>
                  <div className="p-6 border border-slate-200 rounded-2xl bg-white shadow-sm space-y-2">
                    <span className="text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-md">Urgent Notice</span>
                    <h3 className="text-lg font-bold text-slate-900">VTU Internal Assessment Schedule</h3>
                    <p className="text-sm text-slate-600">The IA-1 examination will commence from 10th October 2026. Check subject-wise schedule.</p>
                  </div>
                </div>
              )}

              {/* PAGE 7: FEEDBACK */}
              {activeTab === 'feedback' && (
                <div className="max-w-2xl space-y-6">
                  <div>
                    <h1 className="text-2xl font-extrabold text-slate-900">Feedback</h1>
                    <p className="text-sm text-slate-500">Have suggestions or spotted an issue? Send us your thoughts!</p>
                  </div>
                  <form onSubmit={(e) => { e.preventDefault(); showToast('Feedback submitted successfully!'); }} className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Subject</label>
                      <input type="text" required placeholder="e.g. Requesting more Data Structures question sets" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Your Message</label>
                      <textarea rows={4} required placeholder="Type your detailed suggestion..." className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></textarea>
                    </div>
                    <button type="submit" className="bg-teal-700 text-white font-bold text-sm px-5 py-2.5 rounded-lg">Submit Feedback</button>
                  </form>
                </div>
              )}

              {/* PAGE 8: SETTINGS */}
              {activeTab === 'settings' && (
                <div className="max-w-2xl space-y-6">
                  <div>
                    <h1 className="text-2xl font-extrabold text-slate-900">Settings</h1>
                    <p className="text-sm text-slate-500">Manage your profile details and preference configurations.</p>
                  </div>
                  <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
                    <div className="flex items-center gap-4">
                      <div className="w-16 h-16 rounded-full bg-slate-100 font-extrabold text-xl flex items-center justify-center">S</div>
                      <div>
                        <div className="text-lg font-bold text-slate-900">Sujan</div>
                        <div className="text-xs text-slate-500">Student Account</div>
                      </div>
                    </div>
                    <button onClick={() => showToast('Settings saved successfully!')} className="bg-teal-700 text-white font-bold text-sm px-5 py-2.5 rounded-lg">Save Settings</button>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* SEARCH MODAL */}
          {searchModalOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-xl rounded-2xl border border-slate-200 shadow-2xl p-4">
                <div className="flex items-center gap-3 border-b border-slate-200 pb-3">
                  <i data-lucide="search" className="w-5 h-5 text-slate-400"></i>
                  <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} autoFocus placeholder="Search topics..." className="w-full text-sm focus:outline-none" />
                  <button onClick={() => setSearchModalOpen(false)} className="text-xs bg-slate-100 rounded px-2 py-1">ESC</button>
                </div>
              </div>
            </div>
          )}

          {toastMessage && (
            <div className="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg text-sm z-50">
              {toastMessage}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NotesVaultReactApp />);
  </script>
</body>
</html>
